controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Joint State Broadcaster: 로봇의 모든 관절 상태를 /joint_states 토픽으로 발행
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Mecanum Drive Controller: /cmd_vel 토픽을 받아 4개의 바퀴 속도를 제어
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
mecanum_drive_controller:
  ros__parameters:
    # 제어할 바퀴 관절 이름 목록
    # left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    # right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"  # Param uses "rear", but joint can be "back_..."
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    
    kinematics:
      wheel_separation: 0.834
      wheelbase: 1.788
      wheels_radius: 0.18  # 이름이 wheel_radius -> wheels_radius 로 변경
    # SDF 플러그인에서 가져온 로봇 제원
    wheel_separation: 0.834        # 좌우 바퀴 사이의 거리
    wheelbase: 1.788               # 앞뒤 바퀴 사이의 거리
    wheel_radius: 0.18             # 바퀴의 반지름

    # ROS 파라미터
    odom_frame_id: odom
    base_frame_id: chassis
    use_stamped_vel: false
    
    # 주행 거리계(Odometry) 발행 속도
    odom_publish_frequency: 50.0

    # 속도 및 가속도 제한
    linear.x.has_velocity_limits: false
    linear.x.max_velocity: 1.0
    linear.x.has_acceleration_limits: false
    linear.x.max_acceleration: 0.8

    angular.z.has_velocity_limits: false
    angular.z.max_velocity: 1.2
    angular.z.has_acceleration_limits: false
    angular.z.max_acceleration: 1.0

# 컨트롤러 활성화
# Launch 파일에서 아래 컨트롤러들을 실행하도록 설정합니다.
# ros2 control load_controller --set-state active joint_state_broadcaster
# ros2 control load_controller --set-state active mecanum_drive_controller