controller_manager:
  ros__parameters:
    update_rate: 100

# Joint State Broadcaster 설정
joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

# Mecanum Drive Controller 설정
mecanum_drive_controller:
  ros__parameters:
    type: mecanum_drive_controller/MecanumDriveController
    
    front_left_wheel_name: "front_left_wheel_joint"
    front_right_wheel_name: "front_right_wheel_joint"
    back_left_wheel_name: "back_left_wheel_joint"
    back_right_wheel_name: "back_right_wheel_joint"

    kinematics:
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.28

    odom_frame_id: "odom"
    base_frame_id: "base_link"
    enable_odom_tf: true
    cmd_vel_timeout: 0.5

    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]