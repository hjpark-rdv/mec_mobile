controller_manager:
  ros__parameters:
    update_rate: 1000  # Increased to match Gazebo's default for better performance

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController
mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "back_left_wheel_joint"  # Param uses "rear", but joint can be "back_..."
    rear_right_wheel_command_joint_name: "back_right_wheel_joint"

    # Optional: If state (feedback) joints differ from command joints
    # front_left_wheel_state_joint_name: "front_left_wheel_joint"
    # ... (similar for others)

    kinematics:
      wheels_radius: 0.05  # Must be > 0.0
      sum_of_robot_center_projection_on_X_Y_axis: 0.28

    odom_frame_id: "odom"
    base_frame_id: "base_link"
    enable_odom_tf: true
    reference_timeout: 0.5  # Renamed from cmd_vel_timeout; resets commands after inactivity

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]