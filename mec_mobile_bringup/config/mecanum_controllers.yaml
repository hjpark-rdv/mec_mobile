# controller_manager, joint_state_broadcaster, mecanum_drive_controller를
# 모두 최상위 레벨에 각각 정의합니다.
controller_manager:
  ros__parameters:
    update_rate: 100

    # 사용할 컨트롤러의 '이름'만 여기에 나열합니다.
    # 각 컨트롤러의 상세 설정은 아래에 별도로 정의합니다.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# Joint State Broadcaster의 상세 설정
joint_state_broadcaster:
  ros__parameters:
    {} # 특별한 파라미터가 필요 없는 경우 비워둡니다.

# Mecanum Drive Controller의 상세 설정
mecanum_drive_controller:
  ros__parameters:
    # 휠 조인트 이름을 왼쪽/오른쪽 리스트로 전달합니다.
    left_wheel_names: ["front_left_wheel_joint", "back_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "back_right_wheel_joint"]

    # ===== 로봇의 실제 측정값이 필요합니다! (매우 중요) =====
    # 바퀴의 반지름 (단위: 미터)
    wheel_radius: 0.05
    
    # 좌우 바퀴 중심 사이의 거리 (단위: 미터)
    wheel_separation_x: 0.20  # 예시 값, 실제 로봇에 맞게 수정하세요.
    
    # 앞뒤 바퀴 중심 사이의 거리 (단위: 미터)
    wheel_separation_y: 0.20  # 예시 값, 실제 로봇에 맞게 수정하세요.
    # =======================================================
    
    # Odometry 관련 설정
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    enable_odom_tf: true
    
    # 속도 명령 타임아웃 (이 시간 동안 명령이 없으면 정지)
    cmd_vel_timeout: 0.5 # seconds

    # 공분산 값
    pose_covariance_diagonal:  [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]